version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/uploads:/app/uploads
      - ./backend/dev.db:/app/dev.db
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./dev.db
      - JWT_SECRET=${JWT_SECRET:-local-dev-secret-do-not-use-in-production}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CORS_ORIGINS=["http://localhost:3000"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Client appends /api itself (see frontend/src/lib/api.ts buildUrl)
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
